name: ai-sdlc verify

# This workflow enforces gate 7 (Verify-Reproducible) of the ai-sdlc
# protocol. It walks every examples/*/DONE.md and re-runs the test command
# captured in gate 3, then diffs the actual output against the expected
# summary in gate 7. A gate-7 violation fails the build.

on:
  pull_request:
    paths:
      - 'examples/**'
      - 'tests/**'
      - 'PROTOCOL.md'
      - 'SKILL.md'
      - '.github/workflows/ai-sdlc-verify.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-python:
    name: ai-sdlc verify (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run example test suite (gate 3)
        run: python -m pytest test_app.py -q --tb=short
      - name: Run spec-test (gate 7 structural check)
        run: |
          cd ../..
          python -m pytest tests/ -q --tb=short

  verify-php:
    name: ai-sdlc verify (php)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Run example test (gate 3 + gate 7 reproduction)
        run: php tests/Controller/HealthControllerTest.php
      - name: Run ai-sdlc php spec-test (live reproduction)
        # Adds the gate-7 structural + live spec-tests from tests/test_php_example.py
        # to this PHP-language job, so PHP-side evidence isn't only re-run
        # from the Python-only verify-python job (where php isn't installed
        # and the live test correctly skips).
        run: |
          cd ../..
          pip install pytest
          python -m pytest tests/test_php_example.py -q --tb=short

  verify-node:
    name: ai-sdlc verify (node)
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: examples/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run example test suite (gate 3 + gate 7 reproduction)
        run: npx vitest run
      - name: Run ai-sdlc node spec-test (live reproduction)
        # Same rationale as verify-php: re-runs tests/test_node_example.py
        # from the Node-only CI job so the live npx vitest reproduction
        # isn't only run from the Python-only verify-python job (where
        # node_modules isn't installed and the live test correctly skips).
        run: |
          cd ../..
          pip install pytest
          python -m pytest tests/test_node_example.py -q --tb=short

  verify-protocol-structure:
    name: ai-sdlc verify (spec-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gate 7 spec-test
        run: |
          pip install pytest
          pip install -r examples/python/requirements.txt
          python -m pytest tests/ -q --tb=short

  verify-install-sh:
    name: ai-sdlc verify (install.sh SHA pin)
    # Confirms that the SHA-pinning in PROTOCOL.md §9 matches the SHA of
    # the shipped SKILL.md. PROTOCOL.md and SKILL.md are the two artifacts
    # every install reads; this job catches a release that bumps SKILL.md
    # without bumping the §9 baseline (or vice versa).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute SKILL.md SHA and check against PROTOCOL.md §9
        run: |
          ACTUAL="$(sha256sum SKILL.md | awk '{print $1}')"
          EXPECTED="$(awk '/SKILL\.md expected SHA256:/ {print $NF}' PROTOCOL.md | tr -d '\`')"
          echo "actual:   $ACTUAL"
          echo "expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::SKILL.md SHA does not match the PROTOCOL.md §9 baseline."
            echo "::error::Update PROTOCOL.md §9 to the new SHA when shipping a SKILL.md change."
            exit 1
          fi
          echo "OK: SKILL.md SHA matches PROTOCOL.md §9."
      - name: Run install.sh (clean path)
        run: |
          ./install.sh
          test -s "$HOME/.hermes/skills/ai-sdlc/SKILL.md"
      - name: Tamper test — install.sh refuses a doctored SKILL.md
        run: |
          cp SKILL.md /tmp/SKILL.md.orig
          printf '\n# tamper\n' >> SKILL.md
          # GitHub Actions wraps `run:` in `bash -e {0}`. The
          # `cmd; rc=$?` idiom is NOT set -e-safe — set -e aborts
          # before the assignment runs. Use `cmd || rc=$?` instead,
          # which absorbs the failure into the OR branch so the
          # whole statement returns 0 and set -e doesn't fire.
          ./install.sh || rc=$?
          mv /tmp/SKILL.md.orig SKILL.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::install.sh accepted a tampered SKILL.md; expected non-zero exit."
            exit 1
          fi
          echo "OK: install.sh refused the tampered SKILL.md with exit $rc."
